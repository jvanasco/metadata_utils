name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tox-env: py36
            image: python:3.6.15-buster
          - tox-env: py37
            image: python:3.7.17-bullseye
          - tox-env: py38
            python-version: '3.8'
          - tox-env: py39
            python-version: '3.9'
          - tox-env: py310
            python-version: '3.10'
          - tox-env: py311
            python-version: '3.11'
          - tox-env: py312
            python-version: '3.12'
          - tox-env: py313
            python-version: '3.13'
          - tox-env: py314
            python-version: '3.14'
          - tox-env: py315
            python-version: '3.15'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: ${{ !matrix.image }}
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        if: ${{ !matrix.image }}
        env:
          TOX_ENV: ${{ matrix.tox-env }}
        run: |
          python -m pip install 'tox>=4,<5'
          python -m tox -e "$TOX_ENV"
      - name: Run legacy Python tests
        if: matrix.image
        env:
          PYTHON_IMAGE: ${{ matrix.image }}
          TOX_ENV: ${{ matrix.tox-env }}
        run: |
          docker run --rm --volume "$PWD:/work" --workdir /work \
            --env TOX_ENV "$PYTHON_IMAGE" sh -ec '
              python -m pip install tox==3.28.0
              python -m tox -e "$TOX_ENV"
            '
      - name: Check typing
        if: matrix.tox-env == 'py314'
        run: python -m tox -e mypy
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.tox-env }}
          path: htmlcov/${{ matrix.tox-env }}
