[metadata]
name = metadata_utils
version = attr: metadata_utils.__VERSION__
description = Lightweight Metadata Support
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/jvanasco/metadata_utils
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
keywords = web
license = MIT
license_file = LICENSE
classifiers =
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
python_requires = >=3.6
package_dir =
    = src
packages = find:
include_package_data = true
zip_safe = false

[options.packages.find]
where = src

[options.package_data]
metadata_utils = py.typed

[options.extras_require]
testing =
    pytest
    mypy

[flake8]
exclude = .eggs/*, .pytest_cache/*, .tox/*, build/*, dist/*
application_import_names = metadata_utils
import_order_style = appnexus

[tox:tox]
envlist = py36, py37, py38, py39, py310, py311, py312, py313, py314, py315, mypy
isolated_build = true

[testenv]
package = wheel
deps =
    pytest
    coverage
setenv =
    COVERAGE_FILE = {envtmpdir}{/}.coverage
commands =
    python -m coverage run --source=metadata_utils -m pytest {posargs}
    python -m coverage html -d htmlcov/{envname}

[testenv:mypy]
basepython = python3.14
deps = mypy
commands = python -m mypy src tests
